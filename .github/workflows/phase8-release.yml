name: Phase 8 Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v2.0.0-rc.1"

permissions:
  contents: read

concurrency:
  group: phase8-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifactRoot: ${{ steps.release.outputs.artifactRoot }}
      commit: ${{ steps.release.outputs.commit }}
      builtAtUtc: ${{ steps.release.outputs.builtAtUtc }}

    steps:
      - name: Validate release ref
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = "tag"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate release worktree
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify release version consistency
        shell: pwsh
        run: |
          .\v2\scripts\release\Test-ReleaseVersionConsistency.ps1

      - name: Resolve release context
        id: release
        shell: bash
        run: |
          set -euo pipefail
          source v2/deploy/versions.env
          test "$RELEASE_VERSION" = "2.0.0-rc.1"
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          artifact_root="v2/artifacts/release/$RELEASE_VERSION"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "artifactRoot=$artifact_root" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "builtAtUtc=$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)" >> "$GITHUB_OUTPUT"

  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CIPHERVAULT_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      CIPHERVAULT_ARTIFACT_ROOT: ${{ needs.prepare.outputs.artifactRoot }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json
      - name: Build frontend
        working-directory: v2/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run format:check
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: phase8-frontend
          path: v2/src/CipherVault.Server/wwwroot
          retention-days: 14

  windows-package:
    needs: [prepare, frontend]
    runs-on: windows-latest
    env:
      CIPHERVAULT_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      CIPHERVAULT_ARTIFACT_ROOT: ${{ needs.prepare.outputs.artifactRoot }}
      CIPHERVAULT_BUILD_COMMIT: ${{ needs.prepare.outputs.commit }}
      CIPHERVAULT_BUILD_TIMESTAMP_UTC: ${{ needs.prepare.outputs.builtAtUtc }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - uses: actions/download-artifact@v4
        with:
          name: phase8-frontend
          path: v2/src/CipherVault.Server/wwwroot
      - name: Restore and test
        run: |
          dotnet restore CipherVault.slnx --locked-mode -p:NuGetAudit=false
          dotnet build CipherVault.slnx -c Release --no-restore -warnaserror
          dotnet test CipherVault.slnx -c Release --no-build --no-restore
      - name: Publish Windows
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE $env:CIPHERVAULT_ARTIFACT_ROOT
          & .\v2\scripts\publish-phase8.ps1 `
            -Rid win-x64 `
            -OutputRoot (Join-Path $root "work/windows") `
            -SkipFrontendBuild
          $publish = Join-Path $root "work/windows/publish"
          & .\v2\scripts\package-phase8.ps1 `
            -Platform windows `
            -PublishRoot $publish `
            -OutputRoot $root
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE $env:CIPHERVAULT_ARTIFACT_ROOT
          .\v2\scripts\verify-phase8.ps1 `
            -ArtifactRoot $root `
            -EvidenceRoot (Join-Path $root "evidence") `
            -ReleaseVersion $env:CIPHERVAULT_RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: phase8-windows
          path: |
            ${{ needs.prepare.outputs.artifactRoot }}/CipherVault-${{ needs.prepare.outputs.version }}-win-x64.zip
            ${{ needs.prepare.outputs.artifactRoot }}/evidence/windows.json
          retention-days: 14

  linux-package:
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    env:
      CIPHERVAULT_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      CIPHERVAULT_ARTIFACT_ROOT: ${{ needs.prepare.outputs.artifactRoot }}
      CIPHERVAULT_BUILD_COMMIT: ${{ needs.prepare.outputs.commit }}
      CIPHERVAULT_BUILD_TIMESTAMP_UTC: ${{ needs.prepare.outputs.builtAtUtc }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - uses: actions/download-artifact@v4
        with:
          name: phase8-frontend
          path: v2/src/CipherVault.Server/wwwroot
      - name: Restore and test
        run: |
          dotnet restore CipherVault.slnx --locked-mode -p:NuGetAudit=false
          dotnet build CipherVault.slnx -c Release --no-restore -warnaserror
          dotnet test CipherVault.slnx -c Release --no-build --no-restore
      - name: Publish Linux
        shell: bash
        run: |
          root="$GITHUB_WORKSPACE/$CIPHERVAULT_ARTIFACT_ROOT"
          bash v2/scripts/publish-phase8.sh \
            --rid linux-x64 \
            --output-root "$root/work/linux" \
            --skip-frontend-build
          publish_root="$root/work/linux/publish"
          bash v2/scripts/package-phase8.sh \
            --platform linux \
            --publish-root "$publish_root" \
            --output-root "$root"
      - name: Verify Ubuntu 22.04 artifact
        run: |
          mkdir -p "$CIPHERVAULT_ARTIFACT_ROOT/evidence"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --env CIPHERVAULT_ARTIFACT_ROOT \
            --env CIPHERVAULT_RELEASE_VERSION \
            ubuntu:22.04 \
            bash -lc '
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                --no-install-recommends \
                ca-certificates curl python3 util-linux binutils \
                libicu-dev libssl3 zlib1g systemd &&
              bash /repo/v2/scripts/verify-phase8.sh \
                --artifact-root "/repo/$CIPHERVAULT_ARTIFACT_ROOT" \
                --evidence-root "/repo/$CIPHERVAULT_ARTIFACT_ROOT/evidence" \
                --distribution ubuntu \
                --distribution-version 22.04
            '
      - name: Verify Debian 12 artifact
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --env CIPHERVAULT_ARTIFACT_ROOT \
            --env CIPHERVAULT_RELEASE_VERSION \
            debian:12 \
            bash -lc '
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                --no-install-recommends \
                ca-certificates curl python3 util-linux binutils \
                libicu-dev libssl3 zlib1g systemd &&
              bash /repo/v2/scripts/verify-phase8.sh \
                --artifact-root "/repo/$CIPHERVAULT_ARTIFACT_ROOT" \
                --evidence-root "/repo/$CIPHERVAULT_ARTIFACT_ROOT/evidence" \
                --distribution debian \
                --distribution-version 12
            '
      - uses: actions/upload-artifact@v4
        with:
          name: phase8-linux
          path: |
            ${{ needs.prepare.outputs.artifactRoot }}/CipherVault-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
            ${{ needs.prepare.outputs.artifactRoot }}/evidence/linux-ubuntu-22.04.json
            ${{ needs.prepare.outputs.artifactRoot }}/evidence/linux-debian-12.json
          retention-days: 14

  docker-package:
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    env:
      CIPHERVAULT_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      CIPHERVAULT_ARTIFACT_ROOT: ${{ needs.prepare.outputs.artifactRoot }}
      CIPHERVAULT_BUILD_COMMIT: ${{ needs.prepare.outputs.commit }}
      CIPHERVAULT_BUILD_TIMESTAMP_UTC: ${{ needs.prepare.outputs.builtAtUtc }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: phase8-frontend
          path: v2/src/CipherVault.Server/wwwroot
      - name: Build formal image
        shell: bash
        run: |
          docker build \
            --file v2/deploy/Dockerfile \
            --build-arg RELEASE_VERSION="$CIPHERVAULT_RELEASE_VERSION" \
            --build-arg BUILD_COMMIT="$CIPHERVAULT_BUILD_COMMIT" \
            --build-arg BUILD_TIMESTAMP_UTC="$CIPHERVAULT_BUILD_TIMESTAMP_UTC" \
            --tag "cipher-vault:$CIPHERVAULT_RELEASE_VERSION" \
            .
          mkdir -p "$CIPHERVAULT_ARTIFACT_ROOT"
          docker save "cipher-vault:$CIPHERVAULT_RELEASE_VERSION" \
            --output "$CIPHERVAULT_ARTIFACT_ROOT/cipher-vault-$CIPHERVAULT_RELEASE_VERSION-docker-linux-amd64.tar"
      - name: Verify Docker artifact
        run: |
          bash v2/scripts/verify-phase8-docker.sh \
            --artifact-root "$CIPHERVAULT_ARTIFACT_ROOT" \
            --evidence-root "$CIPHERVAULT_ARTIFACT_ROOT/evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: phase8-docker
          path: |
            ${{ needs.prepare.outputs.artifactRoot }}/cipher-vault-${{ needs.prepare.outputs.version }}-docker-linux-amd64.tar
            ${{ needs.prepare.outputs.artifactRoot }}/evidence/docker.json
          retention-days: 14

  release-aggregate:
    needs: [prepare, windows-package, linux-package, docker-package]
    runs-on: ubuntu-latest
    env:
      CIPHERVAULT_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      CIPHERVAULT_ARTIFACT_ROOT: ${{ needs.prepare.outputs.artifactRoot }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: phase8-windows
          path: ${{ needs.prepare.outputs.artifactRoot }}
      - uses: actions/download-artifact@v4
        with:
          name: phase8-linux
          path: ${{ needs.prepare.outputs.artifactRoot }}
      - uses: actions/download-artifact@v4
        with:
          name: phase8-docker
          path: ${{ needs.prepare.outputs.artifactRoot }}
      - name: Verify evidence presence
        run: |
          test -s "$CIPHERVAULT_ARTIFACT_ROOT/evidence/windows.json"
          test -s "$CIPHERVAULT_ARTIFACT_ROOT/evidence/linux-ubuntu-22.04.json"
          test -s "$CIPHERVAULT_ARTIFACT_ROOT/evidence/linux-debian-12.json"
          test -s "$CIPHERVAULT_ARTIFACT_ROOT/evidence/docker.json"
      - name: Generate manifest and checksums
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE $env:CIPHERVAULT_ARTIFACT_ROOT
          . .\v2\deploy\versions.ps1
          .\v2\scripts\release\New-ReleaseManifest.ps1 `
            -ReleaseRoot $releaseRoot `
            -Version "${{ needs.prepare.outputs.version }}" `
            -Commit "${{ needs.prepare.outputs.commit }}" `
            -BuiltAtUtc "${{ needs.prepare.outputs.builtAtUtc }}" `
            -RuntimeVersion $CipherVaultDotnetRuntimeVersion `
            -AspNetCoreVersion $CipherVaultAspNetCoreVersion `
            -SdkVersion $CipherVaultDotnetSdkVersion `
            -Sqlite3McVersion $CipherVaultSqlite3McVersion `
            -DockerBaseImage $CipherVaultDockerBaseImage `
            -DockerBaseImageDigest $CipherVaultDockerBaseDigest
          .\v2\scripts\release\Scan-ReleaseArtifacts.ps1 `
            -ReleaseRoot $releaseRoot `
            -Version "${{ needs.prepare.outputs.version }}" `
            -EvidencePath (Join-Path $releaseRoot "evidence/scans.json")
      - uses: actions/upload-artifact@v4
        with:
          name: phase8-release-bundle
          path: ${{ needs.prepare.outputs.artifactRoot }}
          retention-days: 14
