name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json
      - name: Restore .NET
        run: dotnet restore CipherVault.slnx --locked-mode -p:NuGetAudit=false
      - name: Install frontend dependencies
        working-directory: v2/frontend
        run: npm ci --no-audit --no-fund
      - name: Check frontend formatting
        working-directory: v2/frontend
        run: npm run format:check
      - name: Typecheck frontend
        working-directory: v2/frontend
        run: npm run typecheck
      - name: Lint frontend
        working-directory: v2/frontend
        run: npm run lint
      - name: Test frontend
        working-directory: v2/frontend
        run: npm test
      - name: Build frontend
        working-directory: v2/frontend
        run: npm run build
      - name: Build Server for browser verification
        run: dotnet build v2/src/CipherVault.Server/CipherVault.Server.csproj -c Release --no-restore -warnaserror
      - name: Install Chromium
        working-directory: v2/frontend
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        working-directory: v2/frontend
        run: npm run test:e2e
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-frontend-evidence
          path: |
            v2/artifacts/e2e
            v2/frontend/playwright-report
          if-no-files-found: ignore
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: v2-frontend-wwwroot
          path: v2/src/CipherVault.Server/wwwroot
          retention-days: 14

  dotnet-windows:
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v2-frontend-wwwroot
          path: v2/src/CipherVault.Server/wwwroot
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - name: Restore
        run: dotnet restore CipherVault.slnx --locked-mode -p:NuGetAudit=false
      - name: Verify formatting
        run: dotnet format CipherVault.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build CipherVault.slnx -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test CipherVault.slnx -c Release --no-build --no-restore
      - name: Cross-platform backup probe
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "v2-windows"
          dotnet run --project v2/tests/CipherVault.Phase7.ProcessProbe/CipherVault.Phase7.ProcessProbe.csproj -c Release --no-build -- create "$root/source" "$root/backups" "$root/backup.cvbackup" "v2 ci password"
          dotnet run --project v2/tests/CipherVault.Phase7.ProcessProbe/CipherVault.Phase7.ProcessProbe.csproj -c Release --no-build -- restore "$root/backup.cvbackup" "$root/restored" "v2 ci password"
          dotnet run --project v2/tests/CipherVault.Phase7.ProcessProbe/CipherVault.Phase7.ProcessProbe.csproj -c Release --no-build -- verify "$root/restored" "v2 ci password"

  dotnet-linux:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v2-frontend-wwwroot
          path: v2/src/CipherVault.Server/wwwroot
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - name: Restore
        run: dotnet restore CipherVault.slnx --locked-mode -p:NuGetAudit=false
      - name: Verify formatting
        run: dotnet format CipherVault.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build CipherVault.slnx -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test CipherVault.slnx -c Release --no-build --no-restore
      - name: Cross-platform backup probe
        shell: bash
        run: |
          root="$RUNNER_TEMP/v2-linux"
          dotnet run --project v2/tests/CipherVault.Phase7.ProcessProbe/CipherVault.Phase7.ProcessProbe.csproj -c Release --no-build -- create "$root/source" "$root/backups" "$root/backup.cvbackup" "v2 ci password"
          dotnet run --project v2/tests/CipherVault.Phase7.ProcessProbe/CipherVault.Phase7.ProcessProbe.csproj -c Release --no-build -- restore "$root/backup.cvbackup" "$root/restored" "v2 ci password"
          dotnet run --project v2/tests/CipherVault.Phase7.ProcessProbe/CipherVault.Phase7.ProcessProbe.csproj -c Release --no-build -- verify "$root/restored" "v2 ci password"

  docker:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v2-frontend-wwwroot
          path: v2/src/CipherVault.Server/wwwroot
      - name: Build formal image
        run: |
          docker build \
            --file v2/deploy/Dockerfile \
            --build-arg RELEASE_VERSION=2.0.0-rc.1 \
            --build-arg BUILD_COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_TIMESTAMP_UTC="$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)" \
            --tag cipher-vault:ci \
            .
      - name: Inspect image
        run: |
          test "$(docker image inspect cipher-vault:ci --format '{{.Architecture}}')" = "amd64"
          test "$(docker image inspect cipher-vault:ci --format '{{.Config.User}}')" = "10001:10001"
          docker image inspect cipher-vault:ci --format '{{json .Config.Healthcheck}}' |
            grep -q '/api/vault/status'
      - name: Run image smoke
        shell: bash
        run: |
          container="cipher-vault-ci-${RANDOM}-$$"
          volume="cipher-vault-ci-data-${RANDOM}-$$"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run -d \
            --name "$container" \
            --publish 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /tmp \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --volume "$volume:/data" \
            cipher-vault:ci >/dev/null
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/vault/status >/tmp/status.json; then
              break
            fi
            sleep 1
          done
          grep -q '"state":"uninitialized"' /tmp/status.json
          curl -fsS http://127.0.0.1:18080/api/version >/tmp/version.json
          grep -q '"productVersion":"2.0.0-rc.1"' /tmp/version.json
          docker port "$container" 8080/tcp | grep -q '127.0.0.1:18080'

  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository structure
        shell: bash
        run: |
          test -f CipherVault.slnx
          test ! -e CipherVault.sln
          test ! -e v2/CipherVault.V2.slnx
          test "$(grep -c '<Project ' CipherVault.slnx)" -eq 10
          test -z "$(git ls-files src tests scripts poc)"
          test -z "$(git grep -n -E 'CipherVault\.V2\.slnx|CipherVault\.sln([^x]|$)' -- . ':!docs' ':!.github/workflows/ci.yml' || true)"
          test -f v2/deploy/Dockerfile
          test -f v2/deploy/docker-compose.yml
          test -f v2/scripts/publish-phase8.ps1
          test -f v2/scripts/publish-phase8.sh
          test -f v2/scripts/package-phase8.ps1
          test -f v2/scripts/package-phase8.sh
      - name: Reject tracked sensitive artifacts
        shell: bash
        run: |
          candidates="$(
            git ls-files |
              grep -E '(^|/)(appsettings\.Development\.json|.*\.(pdb|cvbackup|db|db-shm|db-wal))$' ||
              true
          )"
          if [[ -n "$candidates" ]]; then
            echo "$candidates" >&2
            exit 1
          fi
