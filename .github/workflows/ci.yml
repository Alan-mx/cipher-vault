name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CipherVault.sln

      - name: Build
        run: dotnet build CipherVault.sln -c Release --no-restore

      - name: Test
        run: dotnet test CipherVault.sln -c Release --no-build
