name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: v2/frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: v2/frontend
        run: npm run typecheck

      - name: Check frontend formatting
        working-directory: v2/frontend
        run: npm run format:check

      - name: Lint frontend
        working-directory: v2/frontend
        run: npm run lint

      - name: Test frontend
        working-directory: v2/frontend
        run: npm test

      - name: Build frontend
        working-directory: v2/frontend
        run: npm run build

      - name: Build Server for browser verification
        run: dotnet build v2/src/CipherVault.Server/CipherVault.Server.csproj -c Release -warnaserror

      - name: Install Chromium
        working-directory: v2/frontend
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        working-directory: v2/frontend
        run: npm run test:e2e

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-frontend-evidence
          path: |
            v2/artifacts/e2e
            v2/frontend/playwright-report
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CipherVault.sln

      - name: Build
        run: dotnet build CipherVault.sln -c Release --no-restore

      - name: Verify formatting
        run: dotnet format CipherVault.sln --verify-no-changes --no-restore

      - name: Test
        run: |
          $projects = @(
            "tests/CipherVault.Auth.Win.Tests/CipherVault.Auth.Win.Tests.csproj",
            "tests/CipherVault.Ui.Wpf.Tests/CipherVault.Ui.Wpf.Tests.csproj",
            "tests/CipherVault.Mcp.Tests/CipherVault.Mcp.Tests.csproj",
            "tests/CipherVault.Host.Tests/CipherVault.Host.Tests.csproj",
            "tests/CipherVault.Core.Tests/CipherVault.Core.Tests.csproj"
          )
          $failedProjects = @()
          $resultsDirectory = Join-Path $PWD "TestResults"
          New-Item -ItemType Directory -Path $resultsDirectory -Force | Out-Null
          foreach ($project in $projects) {
            $projectName = [IO.Path]::GetFileNameWithoutExtension($project)
            dotnet test $project `
              -c Release `
              --no-build `
              --logger "console;verbosity=minimal" `
              --logger "trx;LogFileName=$projectName.trx" `
              --results-directory $resultsDirectory
            if ($LASTEXITCODE -ne 0) {
              $failedProjects += $project
            }
          }
          [xml[]]$trxFiles = Get-ChildItem $resultsDirectory -Filter "*.trx" |
            ForEach-Object { Get-Content -Raw $_.FullName }
          foreach ($trx in $trxFiles) {
            $ns = New-Object System.Xml.XmlNamespaceManager($trx.NameTable)
            $ns.AddNamespace(
              "t",
              "http://microsoft.com/schemas/VisualStudio/TeamTest/2010")
            foreach ($failure in $trx.SelectNodes(
                "//t:UnitTestResult[@outcome='Failed']",
                $ns)) {
              Write-Output "::error title=Test failed::$($failure.testName)"
            }
          }
          if ($failedProjects.Count -gt 0) {
            Write-Output "Failed projects: $($failedProjects -join ', ')"
            exit 1
          }

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  phase7-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore v2/CipherVault.V2.slnx --locked-mode -p:NuGetAudit=false

      - name: Build
        run: dotnet build v2/CipherVault.V2.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: |
          dotnet test v2/tests/CipherVault.Core.Tests/CipherVault.Core.Tests.csproj -c Release --no-build --no-restore
          dotnet test v2/tests/CipherVault.Application.Tests/CipherVault.Application.Tests.csproj -c Release --no-build --no-restore
          dotnet test v2/tests/CipherVault.Server.Tests/CipherVault.Server.Tests.csproj -c Release --no-build --no-restore

      - name: Cross-platform backup probe
        shell: bash
        run: |
          root="$RUNNER_TEMP/phase7-linux"
          dotnet run --project v2/tests/CipherVault.Phase7.ProcessProbe/CipherVault.Phase7.ProcessProbe.csproj -c Release -- \
            create "$root/source" "$root/backups" "$root/backup.cvbackup" "phase7 ci password"
          dotnet run --project v2/tests/CipherVault.Phase7.ProcessProbe/CipherVault.Phase7.ProcessProbe.csproj -c Release -- \
            restore "$root/backup.cvbackup" "$root/restored" "phase7 ci password"
          dotnet run --project v2/tests/CipherVault.Phase7.ProcessProbe/CipherVault.Phase7.ProcessProbe.csproj -c Release -- \
            verify "$root/restored" "phase7 ci password"

  phase7-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore v2/CipherVault.V2.slnx --locked-mode -p:NuGetAudit=false

      - name: Build
        run: dotnet build v2/CipherVault.V2.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: |
          dotnet test v2/tests/CipherVault.Core.Tests/CipherVault.Core.Tests.csproj -c Release --no-build --no-restore
          dotnet test v2/tests/CipherVault.Application.Tests/CipherVault.Application.Tests.csproj -c Release --no-build --no-restore
          dotnet test v2/tests/CipherVault.Server.Tests/CipherVault.Server.Tests.csproj -c Release --no-build --no-restore

      - name: Cross-platform backup probe
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "phase7-windows"
          dotnet run --project v2/tests/CipherVault.Phase7.ProcessProbe/CipherVault.Phase7.ProcessProbe.csproj -c Release -- create "$root/source" "$root/backups" "$root/backup.cvbackup" "phase7 ci password"
          dotnet run --project v2/tests/CipherVault.Phase7.ProcessProbe/CipherVault.Phase7.ProcessProbe.csproj -c Release -- restore "$root/backup.cvbackup" "$root/restored" "phase7 ci password"
          dotnet run --project v2/tests/CipherVault.Phase7.ProcessProbe/CipherVault.Phase7.ProcessProbe.csproj -c Release -- verify "$root/restored" "phase7 ci password"

  phase7-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Docker backup restore
        shell: bash
        run: bash v2/scripts/verify-phase7-docker.sh "$GITHUB_WORKSPACE"
