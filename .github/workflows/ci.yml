name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CipherVault.sln

      - name: Build
        run: dotnet build CipherVault.sln -c Release --no-restore

      - name: Verify formatting
        run: dotnet format CipherVault.sln --verify-no-changes --no-restore

      - name: Test
        run: |
          $projects = @(
            "tests/CipherVault.Auth.Win.Tests/CipherVault.Auth.Win.Tests.csproj",
            "tests/CipherVault.Ui.Wpf.Tests/CipherVault.Ui.Wpf.Tests.csproj",
            "tests/CipherVault.Mcp.Tests/CipherVault.Mcp.Tests.csproj",
            "tests/CipherVault.Host.Tests/CipherVault.Host.Tests.csproj",
            "tests/CipherVault.Core.Tests/CipherVault.Core.Tests.csproj"
          )
          foreach ($project in $projects) {
            dotnet test $project -c Release --no-build
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
