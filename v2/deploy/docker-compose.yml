services:
  cipher-vault:
    image: ${CIPHERVAULT_IMAGE:?CIPHERVAULT_IMAGE must be set from versions.env}
    container_name: cipher-vault
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CIPHERVAULT_PORT:-8080}:8080"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      CIPHERVAULT_PUBLIC_HTTP_PORTS: "${CIPHERVAULT_PORT:-8080}"
      CIPHERVAULT_CONTAINER_MODE: "true"
      CIPHERVAULT_DATA_DIR: "/data/vault"
      CIPHERVAULT_CONFIG_DIR: "/data/config"
      CIPHERVAULT_BACKUP_DIR: "/data/backups"
    volumes:
      - cipher-vault-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  cipher-vault-data:
    name: cipher-vault-data
